name: next-express-micro
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ["127.0.0.1:5432:5432"] # للـ migrations من جهازك أو SSH tunnel، مش مفتوح للإنترنت
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10
    networks: [private]

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    restart: unless-stopped
    env_file: ./apps/gateway/.env
    environment:
      NODE_ENV: production
      AUTH_SERVICE_URL: http://auth-service:4001
      TEST_SERVICE_URL: http://test-service:4002
      # <generator:gateway-env>
    depends_on:
      auth-service: { condition: service_healthy }
    ports: ["4000:4000"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:4000/health"]
      interval: 5s
      retries: 10
    networks: [private]

  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    restart: unless-stopped
    env_file: ./apps/auth-service/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/auth_service
    depends_on:
      db: { condition: service_healthy }
    expose: ["4001"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:4001/health"]
      interval: 5s
      retries: 10
    networks: [private]

  test-service:
    build:
      context: .
      dockerfile: apps/test-service/Dockerfile
    restart: unless-stopped
    env_file: ./apps/test-service/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/test_service
    depends_on:
      db: { condition: service_healthy }
    expose: ["4002"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:4002/health"]
      interval: 5s
      retries: 10
    networks: [private]

  # <generator:services>

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      args:
        GATEWAY_URL: http://gateway:4000
    restart: unless-stopped
    env_file: ./apps/client/.env
    environment:
      GATEWAY_URL: http://gateway:4000
    depends_on:
      gateway: { condition: service_healthy }
    ports: ["3000:3000"]
    networks: [private]

networks:
  private:
    driver: bridge

volumes:
  pgdata:
