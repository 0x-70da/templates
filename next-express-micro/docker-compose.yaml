services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10
    networks: [private]

  redis:
    image: redis:7-alpine
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:-redis-password}",
        "--maxmemory-policy",
        "noeviction",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis-password}", "ping"]
      interval: 5s
      retries: 10
    networks: [private]

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    env_file: ./apps/gateway/.env
    depends_on:
      auth-service: { condition: service_healthy }
      test-service: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["4000:4000"]
    networks: [private]

  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    env_file: ./apps/auth-service/.env
    depends_on:
      db: { condition: service_healthy }
    expose: ["4001"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4001/health"]
      interval: 5s
      retries: 10
    networks: [private]

  test-service:
    build:
      context: .
      dockerfile: apps/test-service/Dockerfile
    env_file: ./apps/test-service/.env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    expose: ["4002"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4002/health"]
      interval: 5s
      retries: 10
    networks: [private]

  # <generator:services>

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      args:
        GATEWAY_URL: http://gateway:4000
    env_file: ./apps/client/.env
    depends_on:
      gateway: { condition: service_started }
    ports: ["3000:3000"]
    networks: [private]

networks:
  private:
    driver: bridge

volumes:
  pgdata:
