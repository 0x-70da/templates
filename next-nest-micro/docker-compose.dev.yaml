services:
  db:
    image: postgres:17-alpine
    container_name: micro-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-micro_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - micro_dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-micro_db}"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  micro_dev_postgres_data:
